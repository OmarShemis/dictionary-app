[project]
name = "dictionary-app"
version = "0.1.0"
description = "A desktop English dictionary"
readme = "README.md"
authors = [
    { name = "OmarShemis", email = "omarshimais@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.2",
    "PySide6>=6.8,<7",
]

[project.scripts]
dictionary-app = "dictionary_app:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

